# ===================================================================
# Netlify Proxy Redirect Rule
# यह नियम /api/ से शुरू होने वाली किसी भी रिक्वेस्ट को पकड़ता है
# और उसे आपके Render सर्वर पर भेजता है।
# ===================================================================
[[redirects]]
  from = "/api/*"
  to = "https://my-app-18kg.onrender.com/:splat"
  status = 200 # यह इसे एक प्रॉक्सी बनाता है, रीडायरेक्ट नहीं।
