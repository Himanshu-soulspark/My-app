# ===================================================================
# Netlify Proxy Redirect Rule
# Yeh rule /api/ se shuru hone wali sabhi requests ko
# aapke naye Render server par bhej dega.
# ===================================================================
[[redirects]]
  from = "/api/*"
  to = "https://my-app-oeua.onrender.com/:splat"
  status = 200 # Yeh zaroori hai taaki yeh ek proxy ki tarah kaam kare, redirect ki tarah nahi.
